plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ialocalbridge'
    compileSdk 33

    defaultConfig {
        applicationId "com.ialocalbridge"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release secrets are supplied outside the repository, never committed.
    signingConfigs {
        release {
            def filePath = System.getenv("NEM_SIGNING_STORE_FILE")
            def password = System.getenv("NEM_SIGNING_PASSWORD")
            if (filePath && password) {
                storeFile file(filePath)
                storePassword password
                keyAlias "nemapibridge"
                keyPassword password
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("NEM_SIGNING_STORE_FILE") && System.getenv("NEM_SIGNING_PASSWORD")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Serveur HTTP (NanoHTTPD)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    
    // JSON (Gson)
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // OkHttp pour l'upload de fichiers
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
